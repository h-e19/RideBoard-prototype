<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RideBoard Prototype</title>
<style>
  /* Layout: task runner | live phone | annotation notes. Grayscale wireframe, deliberately single (paper) theme. */
  :root{
    --ink:#222; --mid:#666; --soft:#9a9a9a; --line:#c4c4c4; --fill:#ececec; --fill2:#f6f6f6;
    --page:#fafaf9; --paper:#ffffff; --dark:#3a3a3a; --ok:#2f6b3a; --warn:#8a5a12;
    --ui:Arial,Helvetica,sans-serif; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  html,body{background:var(--page);color:var(--ink)}
  body{margin:0;font-family:var(--ui);font-size:13px;line-height:1.4}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #111;outline-offset:2px}
  .wrap{max-width:1240px;margin:0 auto;padding-block:24px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  header.page h1{font-size:22px;margin:0 0 4px;text-wrap:balance}
  header.page p{margin:2px 0;color:var(--mid);max-width:760px}
  .layout{display:grid;grid-template-columns:280px 344px minmax(0,1fr);gap:24px;margin-top:20px;align-items:start}
  @media (max-width:1020px){.layout{grid-template-columns:minmax(0,1fr) 344px}.notes{grid-column:1 / -1}}
  @media (max-width:720px){.layout{grid-template-columns:minmax(0,1fr)}.stage{order:-1}}
  .panel{background:var(--paper);border:1px dashed #cfcfcf;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
  .panel h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin:0;color:var(--mid)}
  .task{border:1.5px solid var(--ink);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px;background:#fff}
  .task.on{background:var(--fill2);box-shadow:inset 3px 0 0 var(--ink)}
  .task .tid{font-family:var(--mono);font-size:11px;color:var(--mid)}
  .task p{margin:0}
  .task .meta{font-size:11px;color:var(--mid)}
  .runbar{font-family:var(--mono);font-size:12px;display:flex;gap:12px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
  .result{font-size:12px;border-radius:6px;padding:6px 8px;background:var(--fill)}
  .result.ok{background:#e4efe5;color:var(--ok)}
  .result.part{background:#f5ecdc;color:var(--warn)}
  .pbtn{border:1.5px solid var(--ink);border-radius:6px;padding:5px 10px;font-size:12px;background:#fff;align-self:flex-start}
  .pbtn.dark{background:var(--dark);color:#fff;border-color:var(--dark)}
  .jump{display:flex;flex-direction:column;gap:2px}
  .jump button{text-align:left;padding:5px 8px;border-radius:5px;font-size:12px}
  .jump button:hover{background:var(--fill2)}
  .jump button.cur{background:var(--fill);font-weight:bold}
  .log{font-family:var(--mono);font-size:11px;display:flex;flex-direction:column;gap:3px;font-variant-numeric:tabular-nums}
  .stage{display:flex;flex-direction:column;align-items:center;gap:10px}
  .role{font-size:11px;color:var(--mid);text-transform:uppercase;letter-spacing:.06em}
  .helper{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .helper button{font-size:11px;color:var(--mid);border:1px dashed var(--soft);border-radius:12px;padding:3px 9px}
  .switch{display:flex;align-items:center;gap:8px;font-size:12px}
  .notes ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
  .notes li{display:flex;gap:8px;font-size:12.5px;max-width:65ch}
  .notes li b.n{flex:none;width:20px;height:20px;border-radius:50%;background:#111;color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center}
  .notes em{color:var(--mid);font-style:normal;display:block;font-size:11.5px}
  .notes h3{margin:0;font-size:15px}
  .notes .ids{font-size:11px;color:var(--mid);font-family:var(--mono)}

  /* ---------- phone ---------- */
  .phone{position:relative;width:320px;max-width:100%;height:640px;border:2px solid var(--ink);border-radius:28px;padding:14px 10px 10px;background:#fff;display:flex;flex-direction:column;overflow:hidden}
  .phone:before{content:"";display:block;width:70px;height:6px;border-radius:4px;background:var(--line);margin:0 auto 8px;flex:none}
  .scr{flex:1;display:flex;flex-direction:column;min-height:0}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1.5px solid var(--ink);padding:4px 2px 8px;margin-bottom:8px;font-weight:bold;flex:none}
  .bar small{font-weight:normal;color:var(--mid)}
  .bar .sp{width:16px}
  .content{flex:1;display:flex;flex-direction:column;gap:9px;overflow-y:auto;padding:9px 9px 6px;margin:-9px -9px 0;min-height:0}
  .tabbar{display:flex;justify-content:space-around;border-top:1.5px solid var(--ink);padding-top:8px;margin-top:8px;font-size:11px;color:var(--mid);flex:none}
  .tabbar button.on{color:var(--ink);font-weight:bold}
  .card{border:1.5px solid var(--ink);border-radius:8px;padding:9px;position:relative;background:#fff;display:flex;flex-direction:column;gap:3px}
  .card.soft{border-color:var(--soft);border-style:dashed}
  .card.faded{opacity:.55}
  .muted{color:var(--mid)} .tiny{font-size:11px}
  .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .between{justify-content:space-between}
  .btn{display:inline-block;border:1.5px solid var(--ink);border-radius:6px;padding:6px 10px;text-align:center;background:#fff;font-size:12px}
  .btn.primary{background:var(--dark);color:#fff;border-color:var(--dark)}
  .btn.block{display:block;width:100%}
  .btn.done{border-style:dashed;color:var(--mid);cursor:default}
  .btn:active{transform:translateY(1px)}
  .link{text-decoration:underline;color:var(--mid);font-size:12px}
  .chip{border:1.5px solid var(--ink);border-radius:14px;padding:3px 9px;font-size:11px;background:#fff}
  .chip.on{background:var(--dark);color:#fff;border-color:var(--dark)}
  .badge{border:1px solid var(--ink);border-radius:4px;padding:1px 6px;font-size:11px;background:var(--fill);white-space:nowrap}
  .label{font-size:11px;color:var(--mid);margin-bottom:3px;display:block}
  .selwrap{position:relative}
  .selwrap:after{content:"▾";position:absolute;right:10px;top:50%;transform:translateY(-50%);pointer-events:none;font-size:12px}
  select.field,input.field{appearance:none;-webkit-appearance:none;width:100%;border:1.5px solid var(--ink);border-radius:6px;padding:7px 26px 7px 9px;background:#fff;font:inherit;color:inherit}
  input.amt{width:64px;border:0;border-bottom:1.5px solid var(--ink);font:inherit;padding:1px 2px;background:transparent}
  input.amt:disabled{border-bottom-color:var(--line)}
  .seg{display:flex;border:1.5px solid var(--ink);border-radius:6px;overflow:hidden}
  .seg button{flex:1;text-align:center;padding:6px 4px;font-size:12px}
  .seg button.on{background:var(--dark);color:#fff}
  .tabs{display:flex;border-bottom:1.5px solid var(--line)}
  .tabs button{flex:1;text-align:center;padding:6px;color:var(--mid)}
  .tabs button.on{color:var(--ink);font-weight:bold;border-bottom:3px solid var(--ink);margin-bottom:-1.5px}
  .avatar{width:30px;height:30px;border:1.5px solid var(--ink);border-radius:50%;flex:none;background:
    linear-gradient(45deg,transparent 47%,var(--soft) 48%,var(--soft) 52%,transparent 53%),
    linear-gradient(-45deg,transparent 47%,var(--soft) 48%,var(--soft) 52%,transparent 53%)}
  .radio{display:flex;align-items:center;gap:6px;font-size:12px;padding:3px 0;text-align:left;width:100%}
  .radio i{width:13px;height:13px;border:1.5px solid var(--ink);border-radius:50%;display:inline-block;flex:none}
  .radio.on i{background:radial-gradient(circle,var(--ink) 40%,transparent 45%)}
  .toggle{width:32px;height:18px;border:1.5px solid var(--ink);border-radius:10px;position:relative;flex:none}
  .toggle:after{content:"";position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;background:var(--ink);transition:left .15s}
  .toggle.on{background:var(--dark)}
  .toggle.on:after{left:15px;background:#fff}
  .stepper{display:flex;align-items:center;border:1.5px solid var(--ink);border-radius:6px;overflow:hidden;width:max-content}
  .stepper button,.stepper span{padding:3px 10px}
  .stepper span{border-left:1.5px solid var(--ink);border-right:1.5px solid var(--ink);min-width:30px;text-align:center}
  .status{background:var(--fill);border-radius:6px;padding:6px 8px;font-size:12px;position:relative;margin-top:5px}
  .dots{display:flex;gap:4px;margin-top:5px}
  .dots i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ink);display:inline-block}
  .dots i.o{background:var(--ink)}
  .dots i.x{background:var(--soft);border-color:var(--soft)}
  .dots i.p{background:repeating-linear-gradient(45deg,#fff 0 2px,var(--soft) 2px 3px)}
  .pulse{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ink);margin-right:4px;animation:pl 1.2s infinite}
  @keyframes pl{50%{opacity:.25}}
  .empty{border:1.5px dashed var(--ink);border-radius:8px;padding:12px;text-align:center;display:flex;flex-direction:column;gap:8px;position:relative}
  .sec{font-weight:bold;font-size:12px;margin-top:2px}
  .note{font-size:11px;color:var(--mid);border-left:3px solid var(--line);padding-left:6px}
  .err{font-size:11px;color:#9b1c1c}
  .dim{position:absolute;inset:0;background:rgba(0,0,0,.3);z-index:20}
  .modal{position:absolute;left:18px;right:18px;top:200px;background:#fff;border:2px solid var(--ink);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;z-index:21}
  .sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-top:2px solid var(--ink);border-radius:16px 16px 0 0;padding:12px 14px 16px;display:flex;flex-direction:column;gap:9px;z-index:21;max-height:85%;overflow-y:auto}
  .sheet:before{content:"";width:40px;height:4px;border-radius:3px;background:var(--line);align-self:center}
  .menu button{text-align:left;padding:8px 4px;border-bottom:1px solid var(--fill);font-size:13px}
  .toast{position:absolute;left:14px;right:14px;bottom:52px;background:var(--dark);color:#fff;border-radius:8px;padding:8px 10px;font-size:12px;z-index:30}
  .car{overflow:hidden;touch-action:pan-y;margin:0 -10px}
  .track{display:flex;transition:transform .25s ease;user-select:none;-webkit-user-select:none;cursor:grab}
  .track.drag{transition:none;cursor:grabbing}
  .slide{flex:0 0 100%;padding:10px}
  .carnav{display:flex;align-items:center;justify-content:space-between}
  .carnav button{width:32px;height:32px;border:1.5px solid var(--ink);border-radius:50%;font-size:16px;line-height:1}
  .carnav button:disabled{opacity:.3;cursor:default}
  .cdots{display:flex;gap:6px}
  .cdots i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--ink)}
  .cdots i.on{background:var(--ink)}
  @media (prefers-reduced-motion:reduce){.track{transition:none}}
  /* WhatsApp */
  .wa .bar{justify-content:flex-start}
  .wa .bar .grow{flex:1}
  .chat{flex:1;background:var(--fill2);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px;overflow-y:auto;min-height:0;
    background-image:radial-gradient(#e2e2e2 1px,transparent 1px);background-size:12px 12px}
  .b{max-width:84%;padding:6px 8px;border-radius:8px;border:1.2px solid var(--soft);background:#fff;font-size:12px;position:relative;align-self:flex-start}
  .b.me{align-self:flex-end;background:#dcdcdc;border-color:#b0b0b0}
  .b .t{display:block;text-align:right;font-size:9px;color:var(--soft);margin-top:2px}
  .qr{display:flex;flex-direction:column;gap:4px;max-width:84%;position:relative}
  .qr.h{flex-direction:row;flex-wrap:wrap}
  .qr .btn{font-size:11.5px;padding:5px 8px;border-color:var(--mid)}
  .qr .btn.on{background:var(--dark);color:#fff}
  .sep{align-self:center;font-size:10px;color:var(--mid);background:#fff;border:1px solid var(--line);border-radius:8px;padding:1px 8px}
  .typing{font-size:11px;color:var(--mid);font-style:italic}
  .compose{display:flex;gap:6px;margin-top:8px;flex:none}
  .compose .in{flex:1;border:1.5px solid var(--ink);border-radius:16px;padding:6px 10px;color:var(--soft)}
  .compose .in.typed{color:var(--ink)}
  .compose button{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--ink)}
  .compose button.go{background:var(--dark);color:#fff}
  /* markers */
  .rel{position:relative}
  .mk{position:absolute;top:-9px;right:-9px;width:20px;height:20px;border-radius:50%;background:#111;color:#fff;font-size:11px;font-weight:bold;display:flex;align-items:center;justify-content:center;z-index:5;box-shadow:0 0 0 2px #fff;pointer-events:none}
  .mk.l{right:auto;left:-9px}
  .nomk .mk{display:none}
  @media (prefers-reduced-motion:reduce){.pulse{animation:none}.toggle:after{transition:none}}
</style>

</head>
<body>
<div class="wrap">
  <header class="page">
    <h1>RideBoard: clickable prototype</h1>
    <p>Phase 2 wireframes, wired up. Everything on the phone responds: run a Phase 3 task on the left, or jump to any of the 10 screens. Numbered markers map elements to requirements; the notes on the right follow whatever screen is showing.</p>
  </header>
  <div class="layout">
    <aside class="panel" id="tasks"></aside>
    <div class="stage">
      <div class="role" id="role"></div>
      <div class="phone" id="phone"></div>
      <div class="helper" id="helper"></div>
    </div>
    <aside class="panel notes" id="notes"></aside>
  </div>
</div>

<script>
/* ---------------- data ---------------- */
const PLACES=['Main campus','City campus','Gulshan-e-Iqbal','Gulistan-e-Jauhar','DHA','Clifton','North Nazimabad','PECHS'];
const AREAS=['Main','City','Gulshan','Jauhar','DHA','Clifton','North Naz','PECHS','Johar Mor','NIPA'];

const fareTxt=r=>r.fare==='favour'?'Free · favour':'Rs '+(r.fareAmt||'—');

const TODAY=[
  {id:'t1',campus:'Main',to:'Jauhar',via:['Gulshan'],sub:'Car',time:'5:30 pm',eve:true,fare:'Free · favour',seats:2},
  {id:'t2',campus:'Main',to:'Gulshan',via:[],sub:'Shared Yango',time:'6:15 pm',eve:true,fare:'Rs 200',seats:1},
  {id:'t3',campus:'Main',to:'Gulshan',via:[],sub:'Car',time:'2:10 pm',eve:false,fare:'Free · favour',seats:3},
  {id:'t4',campus:'City',to:'Gulshan',via:[],sub:'Car',time:'5:00 pm',eve:true,fare:'Rs 150',seats:2},
  {id:'t5',campus:'Main',to:'DHA',via:[],sub:'Car',time:'6:00 pm',eve:true,fare:'Free · favour',seats:1}
];
const NEEDED=[
  {id:'n1',name:'Hania',campus:'Main',to:'Gulshan',via:[],when:'Whenever',posted:'4 min ago',eve:true,seats:1},
  {id:'n3',name:'Sana',campus:'Main',to:'Gulshan',via:[],when:'Between 5–6 pm',posted:'20 min ago',eve:true,seats:2},
  {id:'n4',name:'Iqra',campus:'Main',to:'Gulshan',via:[],when:'Between 2–3 pm',posted:'35 min ago',eve:false,seats:1},

const REGULAR=[
  {id:'r3',campus:'Main',to:'Gulshan',via:[],days:['Mon','Tue','Thu'],time:'~3:30 pm',eve:false,fare:'Free · favour',seats:1},
  {id:'r1',campus:'Main',to:'Jauhar',via:['Gulshan'],days:['Mon','Wed'],time:'~5:30 pm',eve:true,fare:'Rs 200',seats:2},
  {id:'r2',campus:'Main',to:'DHA',via:[],days:['Tue','Thu'],time:'~4:00 pm',eve:false,fare:'Free · favour',seats:2},
  {id:'r4',campus:'City',to:'Gulshan',via:[],days:['Wed','Fri'],time:'~5:00 pm',eve:true,fare:'Rs 150',seats:1}
];

/* ---------------- chats ---------------- */
const CHATS={
 s7:{who:'Zainab · driver · WhatsApp',nodes:{
  start:{bot:[{h:"Hi! I'm RideBoard 🚗 I'll ping you when someone near you needs a ride. What's your name?",t:'7:02'}],type:'Zainab',to:'email',set:{name:'Zainab'}},

  via:{bot:[{h:'Any areas you pass through on the way? Tap all that apply. I\'ll ping you for those too.',t:'7:04',mk:2}],multi:['Gulshan','Johar Mor','NIPA','Saddar'],to:'done'},

 }},
 s8:{who:'Zainab · driver · WhatsApp',nodes:{

 }},

  acc2:{bot:[{h:"🎉 Confirmed. Hira's number: 03xx-xxxxxxx",t:'7:39'}]},

 }}
};

/* ---------------- annotations ---------------- */

/* ---------------- helpers ---------------- */
const mk=(n,c='')=>`<span class="mk ${c}" aria-hidden="true">${n}</span>`;
const A=(act,arg)=>`data-act="${act}"${arg!==undefined?` data-arg="${String(arg).replace(/"/g,'&quot;')}"`:''}`;
const sel=(id,act,opts,val)=>`<div class="selwrap"><select class="field" id="${id}" ${A(act)}>${opts.map(o=>`<option${o===val?' selected':''}>${o}</option>`).join('')}</select></div>`;
const chip=(label,on,act,arg)=>`<button class="chip${on?' on':''}" ${A(act,arg)} aria-pressed="${!!on}">${label}</button>`;
const radio=(label,on,act,arg)=>`<button class="radio${on?' on':''}" ${A(act,arg)} role="radio" aria-checked="${!!on}"><i></i>${label}</button>`;
const toggle=(on,act,label)=>`<button class="toggle${on?' on':''}" ${A(act)} role="switch" aria-checked="${!!on}" aria-label="${label}"></button>`;
function toast(msg){S.toast=msg;const me=msg;later(2800,()=>{if(S.toast===me){S.toast=null;render()}})}
function tabbar(on){return `<div class="tabbar">${[['home','Home'],['s4','Board'],['s5','Post'],['s6','My rides']].map(([k,l])=>`<button class="${on===k?'on':''}" ${A('tab',k)}>${l}</button>`).join('')}</div>`}
function appBar(right){return `<div class="bar"><button ${A('menu')}>☰ RideBoard</button>${right}</div>`}
function closeBar(title,back='home'){return `<div class="bar"><button ${A('go',back)} aria-label="Close">✕</button><span>${title}</span><span class="sp"></span></div>`}

/* ---------------- views ---------------- */
function statusLine(r,withMk){
  const off=(r.offers||[]).length, pend=r.pinged-r.declined-off;
  const parts=[`Pinged ${r.pinged}`];
  if(off) parts.push(`${off} offer${off>1?'s':''}`);
  parts.push(`${r.declined} declined`,`${pend} pending`);
  const dots=[...Array(off).fill('o'),...Array(r.declined).fill('x'),...Array(pend).fill('p')];
  return `<div class="status rel" role="status">${withMk?mk(1):''}${r.status==='pending'?'<span class="pulse"></span>':'● '}${parts.join(' · ')}<div class="dots">${dots.map(c=>`<i class="${c}"></i>`).join('')}</div></div>`;
}
function reqCard(r,badge,first){
  const M=n=>first?mk(n):'';
  const when=(r.day&&r.day!=='Today'?r.day+' · ':'')+(r.mode==='whenever'?'Whenever, just get me home':'Between '+r.win);
  const live=r.status==='pending'||r.status==='offer';
  let foot='';
  if(r.status==='pending') foot=`<div class="tiny muted">Waiting for drivers. Most reply within 10 minutes, and you'll get a WhatsApp message when an offer arrives.</div>`;
  else if(r.status==='offer') foot=`<div class="rel"><button class="btn primary block" ${A('openOffers',r.id)}>See ${r.offers.length} offer${r.offers.length>1?'s':''}</button>${M(2)}</div>`;
  else if(r.status==='nomatch') foot=`<div class="empty" style="padding:10px"><b>No driver yet</b><span class="muted tiny">Drivers usually reply within 10 minutes. Here's what you can do:</span>
      <div class="rel"><button class="btn primary block" ${A('shareSheet',r.id)}>Booking a ride anyway? Offer the empty seats</button>${M(1)}</div>
      <div class="rel"><button class="btn block" ${A('postGroup',r.id)}>Post to the WhatsApp group</button>${M(2)}</div>
      <div class="rel" style="align-self:center"><button class="link" ${A('keepWaiting',r.id)}>Keep waiting</button>${M(3)}</div></div>`;
  else if(r.status==='confirmed'){const o=r.confirmed;foot=`<div class="row"><div class="avatar"></div><div><b>${o.name}</b> · leaving <b>${o.time}</b><div class="tiny muted">Pickup: ${o.pickup} · <span class="badge">${o.fare}</span></div></div></div>
      <div class="status rel">${M(1)}${o.name}'s number: <b>03xx-xxxxxxx</b><br><span class="tiny muted">She has yours too.</span></div>
      <div class="row between"><button class="btn" ${A('msgDriver',o.name)}>Message ${o.name}</button><button class="link" ${A('clearReq',r.id)}>Done with this request</button></div>
      <div class="note rel">${M(2)}After the ride, we'll ask on WhatsApp whether it happened. One tap.</div>`}
  else if(r.status==='shared'){const s=r.shared;foot=`<div class="status rel">${M(1)}<b>Your ${s.app} is on the board.</b> ${s.seats} seat${s.seats>1?'s':''} at <span class="badge">Rs ${Math.round(s.total/(s.seats+1))} per seat</span><br><span class="tiny muted">Split ${s.seats+1} ways from Rs ${s.total}. You'll get a WhatsApp message when someone requests a seat.</span></div>
      <div class="row between"><button class="btn" ${A('tab','s4')}>See it on the board</button><button class="link" ${A('clearReq',r.id)}>Close request</button></div>`}
  const links=live?`<div class="row rel" style="justify-content:center;gap:16px"><button class="link" ${A('editReq',r.id)}>Edit request</button><button class="link" ${A('askCancelReq',r.id)}>Cancel request</button>${M(r.status==='offer'?3:2)}</div>`:'';
  const status=live?statusLine(r,first):(r.status==='nomatch'?statusLine(r,false):'');
  return `<div class="card" style="gap:6px"><div class="row between"><b>${r.from} → ${short(r.to)}</b><span class="badge">${badge}</span></div>
    <div class="muted tiny" style="margin-top:-4px">${when} · ${r.seats} seat${r.seats>1?'s':''}</div>${status}${foot}${links}</div>`;
}
function vHome(){
  const L=S.reqs;
  let body;
  if(!L.length) body=`<div class="empty" style="margin-top:40px"><b>No active request</b><span class="muted tiny">Tell us where you're going and we'll ping drivers on your route.</span>
      <button class="btn primary block" ${A('newReq')}>Need a ride</button><button class="link" ${A('tab','s4')}>Browse the ride board</button></div>`;
  else body=`<div class="row between"><span class="sec">My requests (${L.length})</span><button class="link" ${A('newReq')}>+ New request</button></div>`
    +L.map((r,i)=>reqCard(r,{pending:'Active',offer:'Active',nomatch:'10 min',confirmed:'Confirmed',shared:'Shared'}[r.status],i===0)).join('')
    +(L.some(r=>r.status==='offer')?`<div class="note">Your number is shared with a driver only after you accept their offer.</div>`:'');
  return `<div class="scr">${appBar('<small>My requests</small>')}<div class="content">${body}</div>${tabbar('home')}</div>`;
}

function offerTimes(c){
  const m=/(\d+)–(\d+) (am|pm)/.exec(c.when);
  return m?[`${m[1]}:00 ${m[3]}`,`${m[1]}:30 ${m[3]}`,`${m[2]}:00 ${m[3]}`]:['6:30 pm','7:00 pm','7:40 pm'];
}
function matchCard(c){
  const b=S.board;
  if(c.campus!==b.campus) return false;
  if(b.area && c.to!==b.area && !c.via.includes(b.area)) return false;
  if(b.eve && !c.eve) return false;
  return true;
}
function vBoard(){
  const b=S.board, isT=b.tab==='today', give=b.side==='give';
  const list=(isT?TODAY:REGULAR).filter(matchCard);
  const showShared=isT&&b.shared&&b.campus==='Main';
  const needs=NEEDED.filter(matchCard);
  const nSeat=list.length+(showShared?1:0);
  let cards='';
  if(!give){
    if(showShared){
      cards+=`<div class="card"><div class="row between"><b>Main → ${short(b.shared.to||'Gulshan')}</b><span class="badge">Rs ${Math.round(b.shared.total/(b.shared.seats+1))}</span></div>
        <div class="tiny muted">Your shared ${b.shared.app} · leaves 6:30 pm</div><div class="row between" style="margin-top:6px"><span class="tiny"><b>${b.shared.seats} seats left</b></span><span class="btn done">Your ride</span></div></div>`;
    }
    list.forEach((c,i)=>{
      const req=b.requested[c.id];
      const head=isT?`<b>${c.campus} → ${c.to}</b>`:`<div class="tiny muted">REGULAR · ${c.days.join(', ').toUpperCase()}</div><b>${c.campus} → ${c.to}</b>`;
      const sub=isT?`${c.sub} · leaves ${c.time}`:`${c.via.length?'via '+c.via.join(', ')+' · ':''}${c.time}`;
      cards+=`<div class="card">${isT?`<div class="row between">${head}<span class="badge">${c.fare}</span></div>`:`<div class="row between"><div>${head}</div><span class="badge">${c.fare}</span></div>`}
        <div class="tiny muted">${isT&&c.via.length?'via '+c.via.join(', ')+' · ':''}${sub}</div>
        <div class="row between rel" style="margin-top:6px"><span class="tiny"><b>${c.seats} seat${c.seats>1?'s':''} left</b></span>
        ${req?`<span class="btn done">Requested${req!==true?' · '+req:''}</span>`:`<button class="btn primary" ${A('seatSheet',c.id)}>Request a seat</button>`}${i===0?mk(4):''}</div></div>`;
    });
    if(!cards) cards=`<div class="empty"><b>No seats on this route yet</b><span class="tiny muted">Try removing a filter, or post a request and we'll ping drivers for you.</span><button class="btn" ${A('newReq')}>Need a ride</button></div>`;
  } else {
    needs.forEach((c,i)=>{
      const sent=b.offered[c.id];
      cards+=`<div class="card">${i===0?mk(3,'l'):''}<div class="row between rel"><b>${c.campus} → ${c.to}</b><span class="tiny muted">posted ${c.posted}</span></div>
        <div class="tiny muted">${c.when} · ${c.seats} seat${c.seats>1?'s':''}</div>
        <div class="row between rel" style="margin-top:6px"><span class="tiny"><b>${c.name}</b> · ✓ IBA verified</span>
        ${sent?`<span class="btn done">Offer sent · ${sent}</span>`:`<button class="btn primary" ${A('offerSheet',c.id)}>I can take her</button>`}${i===0?mk(4):''}</div></div>`;
    });
    if(!cards) cards=`<div class="empty"><b>No one on this route needs a ride</b><span class="tiny muted">We'll ping you on WhatsApp when someone near your route asks.</span><button class="btn" ${A('tab','s5')}>Post a ride instead</button></div>`;
  }
  return `<div class="scr">${appBar(`<button class="btn" style="padding:3px 8px" ${A('tab','s5')}>+ Post</button>`)}<div class="content">
    <div class="rel"><div class="seg"><button class="${!give?'on':''}" ${A('bSide','seat')}>Find a seat (${nSeat})</button><button class="${give?'on':''}" ${A('bSide','give')}>Give a ride (${needs.length})</button></div>${mk(1)}</div>
    <div class="row rel">${chip(b.campus+' ▾',true,'bCampus')}${b.area?chip(b.area+' ✕',true,'bArea'):chip('+ Area',false,'bArea')}${chip('Evening',b.eve,'bEve')}${chip('+ Filter',false,'moreFilter')}${mk(2)}</div>

function vChat(id){

/* ---------------- render ---------------- */
function key(){
  if(S.sheet&&S.sheet.kind==='profile') return 'profile';
  if(S.screen==='s6'&&S.myTab==='riding') return 's6r';
  if(S.screen==='s4'&&S.board.side==='give') return 's4g';
  if(S.sheet&&S.sheet.kind==='offers') return 'offers';
  if(S.screen==='home'){const r=S.reqs[0];if(!r)return'home-empty';return {pending:'pending',offer:'s1',nomatch:'s2',confirmed:'confirmed',shared:'shared'}[r.status]}
  return S.screen;
}
function render(){
  const phone=document.getElementById('phone');
  const k=key();
  const prev=phone.querySelector('.content'), st=prev?prev.scrollTop:0, same=lastKey===S.screen;
  const view={home:vHome,s3:vNew,s4:vBoard,s5:vPost,s6:vRides,s10:vSettings}[S.screen];
  phone.innerHTML=(view?view():vChat(S.screen))+overlay();
  phone.classList.toggle('nomk',!S.mk);
  const c=phone.querySelector('.content'); if(c&&same) c.scrollTop=st;
  const ch=phone.querySelector('#chat'); if(ch) ch.scrollTop=ch.scrollHeight;
  lastKey=S.screen;
  const role=CHATS[S.screen]?CHATS[S.screen].who:(S.screen==='s6'&&S.myTab==='riding')?'Mahnoor · rider · web app':(['s5','s6','s10'].includes(S.screen)?'Zainab · driver · web app':'Mahnoor · rider · web app');
  document.getElementById('role').textContent='Viewing as '+role;
  renderHelper(); renderNotes(k); renderTasks();
}
function renderHelper(){
  const b=[];
  if(S.screen==='home'&&S.reqs.some(r=>r.status==='pending')) b.push(`<button ${A('skip10')}>Skip ahead 10 min (no match)</button>`);
  if(S.screen==='home'&&!S.reqs.length) b.push(`<button ${A('demoOffer')}>Load an example request</button>`);
  b.push(`<button ${A('reset')}>Reset prototype</button>`);
  document.getElementById('helper').innerHTML=b.join('');
}
function renderNotes(k){

    ${a.items.length?`<ol>${a.items.map((it,i)=>`<li><b class="n">${i+1}</b><span>${it[0]}<em>${it[1]}</em></span></li>`).join('')}</ol>`:'<p class="muted" style="margin:0">Nothing annotated here. Tap “Need a ride” to start a request.</p>'}

function renderTasks(){
  const t=S.task;
  let h=`<h2>Phase 3 tasks</h2><p class="muted" style="margin:0;font-size:12px">Start a task to reset the phone to its starting screen. Taps and time are counted until the success condition is met.</p>`;
  TASKS.forEach(T=>{
    const on=t&&t.id===T.id;
    h+=`<div class="task${on?' on':''}"><div class="row between"><span class="tid">${T.id} · starts at Scr ${T.start.slice(1)}</span></div><p>${T.text}</p><div class="meta">Tests ${T.tests}</div>`;
    if(on&&!t.done) h+=`<div class="runbar"><span id="run-taps">${t.taps} taps</span><span id="run-time">${Math.round((Date.now()-t.t0)/1000)} s</span></div><button class="pbtn" ${A('stopTask')}>Stop</button>`;
    else if(on&&t.done) h+=`<div class="result ${t.ok?'ok':'part'}">${t.ok?'✓ Success':'△ Partly'} · ${t.taps} taps · ${t.secs} s${t.note?'<br>'+t.note:''}</div><button class="pbtn" ${A('startTask',T.id)}>Run again</button>`;
    else h+=`<button class="pbtn dark" ${A('startTask',T.id)}>Start ${T.id}</button>`;
    h+=`</div>`;
  });
  if(S.results.length) h+=`<h2>Runs this session</h2><div class="log">${S.results.map(r=>`<span>${r.id} ${r.ok?'✓':'△'} ${r.taps} taps · ${r.secs} s</span>`).join('')}</div>`;
  document.getElementById('tasks').innerHTML=h;
}

/* ---------------- tasks ---------------- */
function startTask(id){
  const T=TASKS.find(x=>x.id===id);
  const results=S.results, mkOn=S.mk;
  S=fresh(); S.results=results; S.mk=mkOn;
  jump(T.start,true);
  S.task={id,taps:0,t0:Date.now(),done:false};
  clearInterval(tick);
  tick=setInterval(()=>{const e=document.getElementById('run-time');if(S.task&&!S.task.done&&e)e.textContent=Math.round((Date.now()-S.task.t0)/1000)+' s'},1000);
}
function ev(name,data){
  const t=S.task; if(!t||t.done) return;
  const res=TASKS.find(x=>x.id===t.id).check(name,data); if(!res) return;
  const [status,...rest]=res.split(':');
  t.done=true; t.ok=status==='ok'; t.note=rest.join(':'); t.secs=Math.round((Date.now()-t.t0)/1000);
  S.results.push({id:t.id,ok:t.ok,taps:t.taps,secs:t.secs});
  clearInterval(tick);
}

/* ---------------- chat engine ---------------- */
function chatEnter(id,nodeId){
  const c=S.chat[id], n=CHATS[id].nodes[nodeId];
  c.node=nodeId; c.sel=[];
  const msgs=typeof n.bot==='function'?n.bot(c.vars):n.bot;
  msgs.forEach(m=>c.log.push(m.sep?{sep:m.sep}:{h:m.h,t:m.t,mk:m.mk}));
  c.lastT=(msgs.filter(m=>m.t).pop()||{}).t||c.lastT;
  if(n.event) ev(n.event,c.vars);
  if(n.auto){c.waiting=true;later(n.auto[1],()=>{c.waiting=false;chatEnter(id,n.auto[0]);render()})}
}
function chatSay(id,text,to,set){
  const c=S.chat[id];
  c.log.push({me:true,h:text,t:c.lastT});
  if(set) Object.assign(c.vars,set);
  c.waiting=true;
  later(550,()=>{c.waiting=false;chatEnter(id,to);render()});
}
function ensureChat(id){const c=S.chat[id];if(!c.node){chatEnter(id,'start')}}

/* ---------------- navigation ---------------- */
function jump(k,quiet){
  S.sheet=null;S.modal=null;S.err=null;S.editing=false;
  if(k==='s1'){S.reqs=[reqOffer(),reqTomorrow()];S.screen='home'}
  else if(k==='s2'){S.reqs=[reqNomatch()];S.screen='home'}
  else if(k==='s3'){S.draft={from:'Main campus',to:'Gulshan-e-Iqbal',mode:'between',win:'7–8 pm',seats:1};if(quiet){S.draft.win=null;S.reqs=[]}S.screen='s3'}
  else if(k==='s5'){S.post=defaultPost();if(quiet){S.post.type='oneoff';S.post.days=[]}S.screen='s5'}
  else S.screen=k;
  if(k==='s6') S.myTab='driving';
  if(k==='s4') S.board.side='seat';
  if(CHATS[k]) ensureChat(k);
}
function go(k){
  S.sheet=null;S.modal=null;S.err=null;
  if(k==='s5'&&S.screen!=='s5'){S.post=defaultPost()}
  S.screen=k; if(CHATS[k]) ensureChat(k);
}
function startPinging(r){
  const my=++r.n, alive=()=>S.reqs.includes(r)&&r.n===my&&r.status==='pending';
  later(1800,()=>{if(alive()){r.declined=Math.min(r.declined+1,r.pinged);render()}});
  later(4200,()=>{if(alive()){const pk=r.from.includes('campus')?'Main gate':short(r.from);
    r.offers=[OFF('Zainab',offerTime(r),'Free · favour',pk,'✓ IBA verified · 2 rides together'),OFF('Hira',altTime(r),'Rs 150',pk,'✓ IBA verified')];
    r.status='offer';if(S.screen!=='home')toast('2 offers for your ride to '+short(r.to)+'. Open Home to see them.');render()}});
}
const altTime=r=>r.mode==='whenever'?'6:30 pm':({'6–7 pm':'6:15 pm','7–8 pm':'7:15 pm','8–9 pm':'8:45 pm'}[r.win]||'7:15 pm');
function slideTo(to,dx){
  const from=S.sheet.idx;S.sheet.idx=to;render();
  const t=document.getElementById('track');if(!t)return;
  t.classList.add('drag');t.style.transform=`translateX(calc(${-from*100}% + ${dx}px))`;void t.offsetWidth;
  t.classList.remove('drag');t.style.transform=`translateX(${-to*100}%)`;
}

/* ---------------- actions ---------------- */
const ACT={
  tab:k=>go(k), go:k=>go(k), menu:()=>{S.sheet={kind:'menu'}}, closeOverlay:()=>{S.sheet=null;S.modal=null;S.err=null},
  jump:k=>jump(k), reset:()=>{const m=S.mk;S=fresh();S.mk=m}, toggleMk:()=>{S.mk=!S.mk},
  startTask:id=>startTask(id), stopTask:()=>{S.task=null;clearInterval(tick)},
  demoOffer:()=>{S.reqs=[reqOffer(),reqTomorrow()]},
  /* new request */
  newReq:()=>{S.draft={from:'Main campus',to:'Gulshan-e-Iqbal',mode:'between',win:'7–8 pm',seats:1};S.editing=false;go('s3')},
  editReq:id=>{const r=reqById(id);S.draft={from:r.from,to:r.to,mode:r.mode,win:r.win,seats:r.seats};go('s3');S.editing=id},
  dFrom:(v,el)=>{S.draft.from=el.value}, dTo:(v,el)=>{S.draft.to=el.value},
  swap:()=>{const d=S.draft;[d.from,d.to]=[d.to,d.from]},
  dMode:v=>{S.draft.mode=v;S.err=null}, dWin:v=>{S.draft.win=v;S.err=null},
  otherTime:()=>toast('A custom time picker opens here. Not built in this prototype.'),
  dSeats:v=>{S.draft.seats=Math.max(1,Math.min(4,S.draft.seats+ +v))},
  findRide:()=>{
    const d=S.draft;
    if(d.from===d.to){S.err='From and To are the same place.';return}
    if(d.mode==='between'&&!d.win){S.err='Pick a time window, or choose "Whenever".';return}
    S.err=null;
    const ed=S.editing; let r;
    if(ed){r=reqById(ed);Object.assign(r,{...d,status:'pending',declined:0,offers:[]})}
    else{r={id:'q'+(++RID),day:'Today',...d,status:'pending',pinged:4,declined:0,offers:[],n:0};S.reqs.unshift(r)}
    S.editing=false;go('home');startPinging(r);
    toast(ed?'Request updated. Drivers have the new details.':'Request sent to 4 drivers on your route.');
  },
  openOffers:id=>{S.sheet={kind:'offers',reqId:id,idx:0}},
  offNav:v=>{const sh=S.sheet,n=reqById(sh.reqId).offers.length,to=Math.max(0,Math.min(n-1,sh.idx+ +v));if(to!==sh.idx)slideTo(to,0);return false},
  offAccept:()=>{const sh=S.sheet,r=reqById(sh.reqId),o=r.offers[sh.idx],others=r.offers.length-1;
    r.confirmed=o;r.declined+=others;r.offers=[];r.status='confirmed';S.sheet=null;ev('acceptOffer',r);
    toast('Ride confirmed with '+o.name+'.'+(others?' The other '+(others>1?others+' drivers were':'driver was')+' told.':''))},
  offDecline:()=>{const sh=S.sheet,r=reqById(sh.reqId),o=r.offers.splice(sh.idx,1)[0];r.declined++;
    if(!r.offers.length){S.sheet=null;r.status='pending';toast(o.name+' is told. Still waiting on the others.');
      const my=++r.n;later(4000,()=>{if(S.reqs.includes(r)&&r.n===my&&r.status==='pending'){r.status='nomatch';render()}})}
    else{sh.idx=Math.min(sh.idx,r.offers.length-1);toast(o.name+' is told. '+r.offers.length+' offer'+(r.offers.length>1?'s':'')+' left.')}},
  askCancelReq:id=>{S.modal={kind:'cancelReq',id}},
  cancelReq:()=>{const id=S.modal.id;S.modal=null;S.reqs=S.reqs.filter(r=>r.id!==id);toast('Request cancelled. Drivers have been told.')},
  clearReq:id=>{const r=reqById(id);if(r&&r.status==='shared')S.board.shared=null;S.reqs=S.reqs.filter(x=>x.id!==id)},
  msgDriver:n=>{toast('Opens your WhatsApp chat with '+n+'.')},
  skip10:()=>{const r=S.reqs.find(x=>x.status==='pending');if(r){r.status='nomatch';r.n++}},
  /* no match */
  shareSheet:id=>{S.sheet={kind:'share',reqId:id,app:'Yango',seats:3,total:800}},
  shApp:v=>{S.sheet.app=v}, shSeats:v=>{S.sheet.seats=Math.max(1,Math.min(4,S.sheet.seats+ +v))},
  shTotal:v=>{S.sheet.total=Math.max(200,S.sheet.total+ +v)},
  shPost:()=>{const s=S.sheet,r=reqById(s.reqId);r.shared={app:s.app,seats:s.seats,total:s.total};S.board.shared={...r.shared,to:r.to};r.status='shared';S.sheet=null;ev('fallback','Offer the empty seats');toast('Your '+s.app+' is on the board.')},
  postGroup:id=>{const r=reqById(id);ev('fallback','Post to the WhatsApp group');toast(`Opens the group with your request typed out: "${short(r.from)} → ${short(r.to)}, ${r.mode==='whenever'?'any time':r.win}, anyone?"`)},
  keepWaiting:id=>{const r=reqById(id);r.status='pending';ev('fallback','Keep waiting');startPinging(r)},
  /* board */
  bTab:v=>{S.board.tab=v}, bEve:()=>{S.board.eve=!S.board.eve},
  bCampus:()=>{S.board.campus=S.board.campus==='Main'?'City':'Main'},
  bArea:()=>{S.board.area=S.board.area?null:'Gulshan'},
  moreFilter:()=>toast('More filters (day, fare, audience) open here. Not built in this prototype.'),
  seatSheet:id=>{S.sheet={kind:'seat',id,day:null};S.err=null},
  seatDay:d=>{S.sheet.day=d;S.err=null},
  sendSeat:()=>{const sh=S.sheet,c=REGULAR.find(x=>x.id===sh.id);
    if(c&&!sh.day){S.err='Pick the day you want the seat.';return}
    S.board.requested[sh.id]=sh.day||true;S.sheet=null;S.err=null;
    S.myTab='riding';
    ev('seatRequest',{id:sh.id,day:sh.day,regular:!!c});toast("Request sent. Track it in My rides › Riding.")},
  myTab:v=>{S.myTab=v},
  withdrawSeat:id=>{delete S.board.requested[id];toast('Request withdrawn. The driver was told.')},
  dropRide:id=>{const r=reqById(id);S.reqs=S.reqs.filter(x=>x.id!==id);toast('Cancelled. '+r.confirmed.name+' got a WhatsApp message.')},
  skipSeat:()=>{S.seatSkip=true;toast('Thursday skipped. Sara was told.')},
  bSide:v=>{S.board.side=v},
  offerSheet:id=>{S.sheet={kind:'offer',id,time:offerTimes(NEEDED.find(x=>x.id===id))[0],fare:'favour'}},
  offTime:v=>{S.sheet.time=v}, offFare:v=>{S.sheet.fare=v},
  sendOffer:()=>{const sh=S.sheet,c=NEEDED.find(x=>x.id===sh.id);S.board.offered[sh.id]=sh.time;S.sheet=null;toast('Offer sent: leaving '+sh.time+'. '+c.name+' gets it on WhatsApp.')},
  /* post */
  pType:v=>{S.post.type=v;S.err=null}, pDay:d=>{const a=S.post.days;S.post.days=a.includes(d)?a.filter(x=>x!==d):DAYS.filter(x=>a.includes(x)||x===d);S.err=null},
  pFrom:(v,el)=>{S.post.from=el.value}, pTo:(v,el)=>{S.post.to=el.value}, pTime:(v,el)=>{S.post.time=el.value},
  pViaRm:v=>{S.post.via=S.post.via.filter(x=>x!==v)}, pViaAdd:(v,el)=>{if(el.value)S.post.via.push(el.value)},
  pSeats:v=>{S.post.seats=Math.max(1,Math.min(6,S.post.seats+ +v))},
  pFare:v=>{S.post.fare=v;S.err=null;if(v==='paid')later(0,()=>{const i=document.getElementById('p-amt');i&&i.focus()})},
  pAmt:(v,el)=>{S.post.fareAmt=el.value.replace(/\D/g,'')}, pAud:v=>{S.post.aud=v},
  postRide:()=>{
    const p=S.post;
    if(p.from===p.to){S.err='From and To are the same place.';return}
    if(p.type==='regular'&&!p.days.length){S.err='Pick at least one day for a regular ride.';return}
    if(p.fare==='paid'&&!p.fareAmt){S.err='Enter the fare per seat, or choose "No, it\'s a favour".';return}
    S.err=null;
    const ride={id:p.editId||'p'+Date.now(),type:p.type,days:p.type==='regular'?[...p.days]:[],from:p.from,to:p.to,via:[...p.via],time:p.time,seats:p.seats,fare:p.fare,fareAmt:p.fareAmt,aud:p.aud,paused:false,cancelled:[]};
    if(p.editId){const i=S.rides.findIndex(r=>r.id===p.editId);ride.taken=S.rides[i].taken;ride.cancelled=S.rides[i].cancelled;S.rides[i]=ride;toast('Changes saved. Riders with a seat were told.')}
    else{ride.taken=0;S.rides.unshift(ride);toast('Posted. Riders on the board can request a seat.')}
    ev('posted',{type:p.type,days:p.type==='regular'?p.days:[],aud:p.aud});
    S.screen='s6';
  },
  /* my rides */
  editRide:id=>{const r=S.rides.find(x=>x.id===id);S.post={type:r.type,days:[...r.days],from:r.from,to:r.to,via:[...r.via],time:r.time.replace('~',''),seats:r.seats,fare:r.fare,fareAmt:r.fareAmt,aud:r.aud,editId:id};S.err=null;S.screen='s5'},
  pauseRide:id=>{const r=S.rides.find(x=>x.id===id);r.paused=!r.paused;toast(r.paused?'Paused. It is hidden from the board until you resume.':'Back on the board.')},
  askCancelRide:a=>{const[id,day]=a.split('|');S.modal={kind:'cancelRide',id,day}},
  cancelRide:()=>{const m=S.modal,r=S.rides.find(x=>x.id===m.id);r.cancelled.push(m.day==='today'?'Today':m.day);S.modal=null;ev('cancelRide');toast(r.taken?'Cancelled. Mahnoor got a WhatsApp message.':'Cancelled.')},
  seatAccept:()=>{S.seatReq='accepted';const r=S.rides.find(x=>x.id==='m1');if(r)r.taken=Math.min(r.seats,r.taken+1);toast('Accepted. Numbers shared on WhatsApp.')},
  seatDecline:()=>{S.seatReq='declined';toast('Declined. Mahnoor was told.')},
  withdraw:()=>{S.offerCard='withdrawn';toast('Offer withdrawn. Mahnoor was told.')},
  /* settings */
  sHome:(v,el)=>{S.settings.home=el.value}, sViaRm:v=>{S.settings.via=S.settings.via.filter(x=>x!==v)},
  sViaAdd:(v,el)=>{if(el.value)S.settings.via.push(el.value)},
  sCampus:v=>{S.settings.campus=v}, sAud:v=>{S.settings.aud=v},
  sPause:()=>{S.settings.pause=!S.settings.pause;toast(S.settings.pause?'No pings until tomorrow morning.':'Pings are back on.')},
  sQuiet:()=>{S.settings.quiet=!S.settings.quiet}, sFollow:()=>{S.settings.follow=!S.settings.follow},
  /* chat */
  chatReply:a=>{const[id,i]=a.split('|');const c=S.chat[id],r=CHATS[id].nodes[c.node].replies[+i];
    if(r[3]==='profile'){S.sheet={kind:'profile'};return}
    chatSay(id,r[0].replace(' ✓',''),r[1],r[2])},
  chatSend:id=>{const c=S.chat[id],n=CHATS[id].nodes[c.node];chatSay(id,n.type,n.to,n.set)},
  chatPick:a=>{const[id,o]=a.split('|');const c=S.chat[id];c.sel=c.sel.includes(o)?c.sel.filter(x=>x!==o):[...c.sel,o]},
  chatDone:id=>{const c=S.chat[id],n=CHATS[id].nodes[c.node];const v=[...c.sel];chatSay(id,v.length?v.join(', '):'None',n.to,{via:v})},
  chatReset:id=>{S.chat[id]=newChat();ensureChat(id)}
};

/* ---------------- events ---------------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const inPhone=el.closest('#phone');
  if(inPhone&&S.task&&!S.task.done){S.task.taps++;const t=document.getElementById('run-taps');if(t)t.textContent=S.task.taps+' taps'}
  if(el.tagName==='SELECT'||el.tagName==='INPUT') return;
  const fn=ACT[el.dataset.act]; if(!fn) return;
  if(fn(el.dataset.arg,el)!==false) render();
});
let drag=null;
function countTap(){if(S.task&&!S.task.done){S.task.taps++;const t=document.getElementById('run-taps');if(t)t.textContent=S.task.taps+' taps'}}
document.addEventListener('pointerdown',e=>{const t=e.target.closest('#track');if(!t)return;drag={x:e.clientX,dx:0};try{t.setPointerCapture(e.pointerId)}catch(_){}t.classList.add('drag')});
document.addEventListener('pointermove',e=>{if(!drag)return;const t=document.getElementById('track');if(!t){drag=null;return}drag.dx=e.clientX-drag.x;t.style.transform=`translateX(calc(${-S.sheet.idx*100}% + ${drag.dx}px))`});
function endDrag(){if(!drag)return;const d=drag;drag=null;const t=document.getElementById('track');if(!t||!S.sheet||S.sheet.kind!=='offers')return;
  const n=reqById(S.sheet.reqId).offers.length;let to=S.sheet.idx;if(d.dx<-40)to++;if(d.dx>40)to--;to=Math.max(0,Math.min(n-1,to));
  if(to!==S.sheet.idx){countTap();slideTo(to,d.dx)}else{t.classList.remove('drag');t.style.transform=`translateX(${-to*100}%)`}}
document.addEventListener('pointerup',endDrag);document.addEventListener('pointercancel',endDrag);
document.addEventListener('keydown',e=>{if(S.sheet&&S.sheet.kind==='offers'&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){e.preventDefault();ACT.offNav(e.key==='ArrowLeft'?-1:1)}});
document.addEventListener('change',e=>{
  const el=e.target; if(el.tagName!=='SELECT') return;
  const fn=ACT[el.dataset.act]; if(fn){fn(el.value,el);render()}
});
document.addEventListener('input',e=>{
  const el=e.target; if(el.tagName!=='INPUT'||!el.dataset.act) return;
  const fn=ACT[el.dataset.act]; if(fn){fn(el.value,el); if(el.value!==S.post.fareAmt) el.value=S.post.fareAmt}
});

S=fresh(); render();
</script>
